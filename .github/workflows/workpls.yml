name: Photok Refactor Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin' # Faster and more reliable than Zulu on GitHub
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # We use 'assembleDebug' because it skips the slow/strict 'build' checks 
      # and just focuses on making the APKs.
      - name: Build Debug APKs
        run: ./gradlew assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Photok-Custom-Build
          # This catches both foss-debug and play-debug
          path: app/build/outputs/apk/**/*.apk
